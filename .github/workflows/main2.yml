name: CI Build

on: [push]

jobs:
  build:
    runs-on: windows-latest

    env:
      Qt5_DIR: C:\Qt\5.15.2\mingw81_64  # 根据你的 Qt 安装路径进行调整

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up MinGW
      uses: egor-tensin/setup-mingw@v1
      with:
        architecture: x86_64

    - name: Set up Qt
      uses: jurplel/install-qt-action@v2
      with:
        version: '5.15.2'
        host: 'windows'
        target: 'mingw81_64'
        dir: 'C:\\Qt'

    - name: Set up CMake
      uses: jwlawson/actions-setup-cmake@v1

    - name: Configure with CMake
      run: cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_PREFIX_PATH="C:\Qt\5.15.2\mingw81_64"

    - name: Build with CMake
      run: cmake --build build --target HybrdLink -j 14
