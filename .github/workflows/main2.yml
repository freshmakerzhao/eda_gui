name: QT Windows Build

on: [push]

jobs:
  build:
    runs-on: windows-latest # 仅在 Windows 上运行
    strategy:
      fail-fast: false
      matrix:
        cmake_flags: ["-DENABLE_MAC_CHECK=OFF -DENABLE_EXPIRATION_CHECK=OFF -DPACK_DEPLOYED=ON"]
    name: Windows Build
    steps:
      - name: Git checkout
        uses: actions/checkout@v3 # 拉取代码

      - name: Install Qt for Windows # 安装 Qt
        uses: jurplel/install-qt-action@v3
        with:
          aqtversion: '==3.1.*'
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw81'
          
      - name: Set PATH for Qt tools
        run: echo "C:\Qt\5.15.2\mingw81_64\bin" >> $GITHUB_PATH

      - name: Print directory structure before configuration # 打印目录结构
        run: dir

      - name: Configure project with CMake # 配置项目
        run: |
          cmake -S src -B build -G "MinGW Makefiles" ${{ matrix.cmake_flags }} -DCMAKE_PREFIX_PATH="C:\Qt\5.15.2\mingw81_64"

      - name: Compile using CMake # 编译项目
        run: |
          cmake --build build --target HybrdLink -- -j %NUMBER_OF_PROCESSORS%

      - name: Pack Windows executable # 打包应用
        run: |
          if exist app (rmdir /s /q app)
                    mkdir app
          cp build/HybrdLink.exe app/
          windeployqt app/HybrdLink.exe
