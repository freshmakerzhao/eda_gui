name: QT Windows Build

on: [push]

jobs:
  build:
    runs-on: windows-latest # 仅在 Windows 上运行
    strategy:
      fail-fast: false
      matrix:
        cmake_flags: ["-DENABLE_MAC_CHECK=OFF -DENABLE_EXPIRATION_CHECK=OFF -DPACK_DEPLOYED=ON"]
        qt_ver: [5.15.2]
    name: Windows Build
    steps:
      - name: Git checkout
        uses: actions/checkout@v3 # 拉取代码

      - name: Cache Qt installation # 缓存 Qt 环境
        id: WindowsCacheQt
        uses: actions/cache@v3
        with:
          path: C:\Qt\5.15.2\mingw81_64
          key: ${{ runner.os }}-Qt-5.15.2-mingw81

      - name: Setup Qt from cache # 设置缓存的 Qt 环境
        if: steps.WindowsCacheQt.outputs.cache-hit == 'true'
        run: echo "C:\Qt\5.15.2\mingw81_64\bin" >> $GITHUB_PATH

      - name: Manage app directory
        shell: pwsh
        run: |
          dir
          $appPath = "D:\a\eda_gui\eda_gui\app"
          if (Test-Path -Path $appPath) {
            Write-Host "Directory 'app' exists. Deleting it now..."
            Remove-Item -Recurse -Force $appPath
            dir
          } else {
            Write-Host "Directory 'app' is not exists."
          }
          New-Item -ItemType Directory -Path $appPath

